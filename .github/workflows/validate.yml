name: Validate IPTV Streams

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual validation'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download fresh iptv-org data
        run: |
          curl -sL https://iptv-org.github.io/api/streams.json  -o scripts/streams_raw.json
          curl -sL https://iptv-org.github.io/api/channels.json -o scripts/channels_raw.json
          echo "streams: $(wc -c < scripts/streams_raw.json) bytes"
          echo "channels: $(wc -c < scripts/channels_raw.json) bytes"

      - name: Split into 5 batches
        run: node scripts/prepare_batches.js

      - name: Test all streams in parallel
        run: |
          node scripts/test_batch.js 0 &
          node scripts/test_batch.js 1 &
          node scripts/test_batch.js 2 &
          node scripts/test_batch.js 3 &
          node scripts/test_batch.js 4 &
          wait
          echo "All batches complete"

      - name: Merge results
        run: node scripts/merge_results.js

      - name: Show summary
        run: |
          node -e "
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/verified_streams.json'));
          console.log('generatedAt:',d.generatedAt);
          console.log('totalAlive:',d.totalAlive,'/',d.totalProbed);
          console.log('channels:',d.namedChannels);
          "

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/verified_streams.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update verified streams [$(date -u +%Y-%m-%d)]" && git push)
